services:
  db:
    image: postgres:16-alpine
    container_name: nrpj740-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: nrpj740_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-admin-secret
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/db/01-init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nrpj740_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dev_pgdata:
