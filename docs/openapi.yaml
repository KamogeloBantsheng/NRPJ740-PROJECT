openapi: 3.0.3
info:
  title: NRPJ740 Campus Maintenance Request & Work-Order Management API
  version: 1.0.0
  description: OpenAPI 3.0 specification for Moroka Hall Residence Maintenance System
    at Sol Plaatje University (NFR-09, Section 6.3)
paths:
  /api/audit-logs/:
    get:
      operationId: api_audit_logs_list
      description: Global audit log search and inspection endpoint for administrators
        (FR-18, SCR-13, TC-41).
      summary: Search system audit logs
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogSearchResponse'
          description: ''
  /api/auth/csrf:
    get:
      operationId: api_auth_csrf
      description: Issues CSRF cookie token for single-origin web client writes.
      summary: Get CSRF token
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
          description: ''
  /api/auth/login:
    post:
      operationId: api_auth_login
      description: Authenticates user, starts 8-hour session, and rotates session
        ID (FR-01, SCR-01).
      summary: User sign-in
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/auth/logout:
    post:
      operationId: api_auth_logout
      description: Invalidates user session and clears authentication cookies (FR-01).
      summary: User sign-out
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/auth/password:
    post:
      operationId: api_auth_change_password
      description: Changes password for authenticated user with Argon2id hashing (FR-02,
        SCR-02).
      summary: Change password
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
  /api/categories/:
    get:
      operationId: api_categories_list
      description: List approved active fault categories in Moroka Hall (FR-05, SCR-04).
      summary: List fault categories
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaultCategory'
          description: ''
  /api/dashboard/:
    get:
      operationId: api_dashboard_metrics
      description: Role-scoped maintenance aggregates for Supervisor and Warden (FR-16,
        SCR-10).
      summary: Operational dashboard metrics
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetricsResponse'
          description: ''
  /api/health/:
    get:
      operationId: api_health_check
      description: Verifies application runtime and PostgreSQL database connectivity
        (NFR-09).
      summary: Health check endpoint
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckDegradedResponse'
          description: ''
  /api/locations/:
    get:
      operationId: api_locations_list
      description: List active locations scoped to the caller's assigned residence
        (FR-05, SCR-04).
      summary: List active locations
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
          description: ''
  /api/me:
    get:
      operationId: api_auth_me
      description: Retrieves profile and role for current authenticated user (FR-01).
      summary: Current user profile
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/requests/:
    get:
      operationId: api_requests_list
      description: Return role-scoped requests for the authenticated user (SCR-03,
        BR-05).
      summary: List maintenance requests
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRequests'
          description: ''
    post:
      operationId: api_requests_create
      description: Submit a new fault report under Table 5.1 T1 rules (SCR-04, FR-05).
      summary: Submit maintenance request
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRequestDetail'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRequestDetail'
          description: ''
  /api/requests/{id}/:
    get:
      operationId: api_requests_retrieve
      description: Retrieve full details of a specific maintenance request (SCR-05,
        FR-06).
      summary: Retrieve maintenance request details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRequestDetail'
          description: ''
  /api/requests/{id}/timeline/:
    get:
      operationId: api_requests_timeline
      description: Retrieve chronological audit timeline for a maintenance request
        (FR-18, SCR-05).
      summary: Retrieve request audit timeline
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestTimelineEvent'
          description: ''
  /api/requests/{id}/transition/:
    post:
      operationId: api_requests_transition
      description: Execute a lifecycle state transition with row lock and concurrency
        guard (Table 5.1, ADR-02).
      summary: Execute request lifecycle transition
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionExecuteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransitionExecuteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransitionExecuteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRequestDetail'
          description: ''
  /api/residences/:
    get:
      operationId: api_residences_list
      description: List active residences for the triage filter and user administration
        (FR-03, FR-08).
      summary: List active residences
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Residence'
          description: ''
  /api/technicians/:
    get:
      operationId: api_technicians_list
      description: List active technicians with workload counts for supervisor dispatch
        (SCR-07, FR-10, FR-11).
      summary: List active technicians for dispatch
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnicianItem'
          description: ''
  /api/triage-queue/:
    get:
      operationId: api_triage_queue_list
      description: Submitted requests, oldest first, at most 50 per page, filterable
        by residence and category (FR-08, SCR-06). Pass status to include other states.
      summary: List the triage queue
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTriageQueue'
          description: ''
  /api/users/:
    get:
      operationId: api_users_list
      description: List users with optional search, role, status and residence filters
        (FR-03, SCR-11).
      summary: List users
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
          description: ''
    post:
      operationId: api_users_create
      description: Create a single user account with auto-generated temporary password
        (FR-03, SCR-11).
      summary: Create user account
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
          description: ''
  /api/users/{id}/:
    get:
      operationId: api_users_retrieve
      description: Retrieve profile details for a specific user (FR-03, SCR-11).
      summary: Retrieve user details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminItem'
          description: ''
    patch:
      operationId: api_users_patch
      description: Update profile, role, active flag, residence, or student number
        (FR-03, BR-07, SCR-11).
      summary: Update user details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminItem'
          description: ''
  /api/users/{id}/reset-password/:
    post:
      operationId: api_users_reset_password
      description: Generate a new temporary password and force password change on
        next login (FR-03, SCR-11).
      summary: Reset user password
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResetPasswordResponse'
          description: ''
  /api/users/import-csv/:
    post:
      operationId: api_users_import_csv
      description: All-or-nothing batch import of user accounts from a CSV file (FR-04,
        SCR-12).
      summary: Batch import users from CSV
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserImportCsvResponse'
          description: ''
  /api/work-queue/:
    get:
      operationId: api_work_queue_list
      description: Active work assigned to the authenticated technician, by priority
        and then assignment time (FR-13, SCR-09, BR-04). Pass status=WORK_COMPLETED
        to see work awaiting verification.
      summary: List assigned technician work orders
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedWorkQueue'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - REQUEST_SUBMITTED
      - CLARIFICATION_REQUESTED
      - CLARIFICATION_PROVIDED
      - REQUEST_APPROVED
      - REQUEST_REJECTED
      - WORK_ASSIGNED
      - WORK_REASSIGNED
      - WORK_STARTED
      - WORK_COMPLETED
      - REQUEST_VERIFIED_CLOSED
      - REQUEST_REOPENED
      - USER_CREATED
      - USER_IMPORTED
      - USER_ROLE_CHANGED
      - USER_DEACTIVATED
      - USER_REACTIVATED
      - PASSWORD_RESET
      - PASSWORD_CHANGED
      - LOGIN_FAILED
      type: string
      description: |-
        * `REQUEST_SUBMITTED` - Request Submitted
        * `CLARIFICATION_REQUESTED` - Clarification Requested
        * `CLARIFICATION_PROVIDED` - Clarification Provided
        * `REQUEST_APPROVED` - Request Approved
        * `REQUEST_REJECTED` - Request Rejected
        * `WORK_ASSIGNED` - Work Assigned
        * `WORK_REASSIGNED` - Work Reassigned
        * `WORK_STARTED` - Work Started
        * `WORK_COMPLETED` - Work Completed
        * `REQUEST_VERIFIED_CLOSED` - Request Verified Closed
        * `REQUEST_REOPENED` - Request Reopened
        * `USER_CREATED` - User Created
        * `USER_IMPORTED` - User Imported
        * `USER_ROLE_CHANGED` - User Role Changed
        * `USER_DEACTIVATED` - User Deactivated
        * `USER_REACTIVATED` - User Reactivated
        * `PASSWORD_RESET` - Password Reset
        * `PASSWORD_CHANGED` - Password Changed
        * `LOGIN_FAILED` - Login Failed
    AuditEventItem:
      type: object
      description: Detailed audit event representation for administrative inspection.
      properties:
        id:
          type: integer
          readOnly: true
        occurred_at:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/ActionEnum'
        action_label:
          type: string
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditUserMini'
          readOnly: true
        target_user:
          allOf:
          - $ref: '#/components/schemas/AuditUserMini'
          readOnly: true
        request_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        tracking_number:
          type: string
          nullable: true
          readOnly: true
        work_order_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        from_status:
          type: string
          nullable: true
          maxLength: 20
        to_status:
          type: string
          nullable: true
          maxLength: 20
        note:
          type: string
          nullable: true
        details: {}
      required:
      - action
      - action_label
      - actor
      - id
      - target_user
      - tracking_number
    AuditLogSearchResponse:
      type: object
      properties:
        total_count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventItem'
        available_actions:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - available_actions
      - events
      - limit
      - offset
      - total_count
    AuditUserMini:
      type: object
      description: Compact user representation for actor/target in audit trail.
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
      required:
      - email
      - full_name
      - id
      - role
    BlankEnum:
      enum:
      - ''
    ChangePasswordRequest:
      type: object
      description: Payload for voluntary or forced password update (SCR-02).
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
    ChangePasswordResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    CsrfTokenResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DashboardMetricsResponse:
      type: object
      properties:
        scope:
          type: object
          additionalProperties: {}
        summary:
          type: object
          additionalProperties: {}
        status_counts:
          type: object
          additionalProperties:
            type: integer
        priority_counts:
          type: object
          additionalProperties:
            type: integer
        category_counts:
          type: array
          items:
            type: object
            additionalProperties: {}
        aging_distribution:
          type: object
          additionalProperties:
            type: integer
      required:
      - aging_distribution
      - category_counts
      - priority_counts
      - scope
      - status_counts
      - summary
    FaultCategory:
      type: object
      description: Serializer for approved maintenance fault categories.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 60
      required:
      - id
      - name
    HealthCheckDegradedResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    KindEnum:
      enum:
      - ROOM
      - COMMON_AREA
      type: string
      description: |-
        * `ROOM` - Room
        * `COMMON_AREA` - Common Area
    Location:
      type: object
      description: Serializer for room and common area locations within a residence.
      properties:
        id:
          type: integer
          readOnly: true
        residence_id:
          type: integer
          readOnly: true
        block:
          type: string
          maxLength: 30
        floor:
          type: integer
          maximum: 32767
          minimum: -32768
        label:
          type: string
          maxLength: 60
        kind:
          $ref: '#/components/schemas/KindEnum'
        display_name:
          type: string
          readOnly: true
      required:
      - block
      - display_name
      - floor
      - id
      - kind
      - label
      - residence_id
    LoginRequest:
      type: object
      description: Payload for user sign-in (SCR-01).
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LogoutResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    MaintenanceRequestDetail:
      type: object
      description: Full detail serializer with nested resident, location, category,
        work order, and timeline (SCR-05).
      properties:
        id:
          type: integer
          readOnly: true
        tracking_number:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PriorityEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        description:
          type: string
        client_token:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        resident:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        is_owner:
          type: boolean
          description: True for the person who reported the fault, who answers clarification
            questions (T3).
          readOnly: true
        location:
          type: object
          additionalProperties: {}
          readOnly: true
        category:
          type: object
          additionalProperties: {}
          readOnly: true
        active_work_order:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        work_orders:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        timeline:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - active_work_order
      - category
      - client_token
      - created_at
      - description
      - id
      - is_owner
      - location
      - resident
      - timeline
      - tracking_number
      - updated_at
      - work_orders
    MaintenanceRequestList:
      type: object
      description: Compact summary serializer for request queue and list views (SCR-03).
      properties:
        id:
          type: integer
          readOnly: true
        tracking_number:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PriorityEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        category_name:
          type: string
          readOnly: true
        location_label:
          type: string
          readOnly: true
        location_block:
          type: string
          readOnly: true
        location_floor:
          type: integer
          readOnly: true
        location_kind:
          type: string
          readOnly: true
        description_snippet:
          type: string
          readOnly: true
        resident_name:
          type: string
          nullable: true
          readOnly: true
        assigned_technician_name:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - assigned_technician_name
      - category_name
      - created_at
      - description_snippet
      - id
      - location_block
      - location_floor
      - location_kind
      - location_label
      - resident_name
      - tracking_number
    NullEnum:
      enum:
      - null
    PagedRequests:
      type: object
      properties:
        status_totals:
          type: object
          additionalProperties:
            type: integer
        total_count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceRequestList'
      required:
      - limit
      - offset
      - results
      - status_totals
      - total_count
    PagedTriageQueue:
      type: object
      properties:
        status_totals:
          type: object
          additionalProperties:
            type: integer
        total_count:
          type: integer
