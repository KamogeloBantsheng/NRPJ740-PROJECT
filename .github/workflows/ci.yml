name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Ruff checks
        run: |
          ruff check backend

      - name: Audit production dependencies (NFR-11)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run client tests
        working-directory: frontend
        run: npm test

      - name: Run TypeScript build
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies (NFR-11)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nrpj740_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Initialize Database Roles
        run: |
          python -c "
          import time, psycopg
          for i in range(15):
              try:
                  with psycopg.connect('postgresql://postgres:postgres_password@localhost:5432/nrpj740_test', autocommit=True) as conn:
                      with conn.cursor() as cur:
                          cur.execute(\"\"\"
                          DO \$\$
                          BEGIN
                              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'nrpj_app') THEN
                                  CREATE ROLE nrpj_app WITH LOGIN PASSWORD 'change-me-app-secret';
                              END IF;
                              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'nrpj_owner') THEN
                                  CREATE ROLE nrpj_owner WITH LOGIN PASSWORD 'change-me-owner-secret';
                              END IF;
                          END
                          \$\$;
                          \"\"\")
                  print('PostgreSQL roles nrpj_app and nrpj_owner initialized successfully.')
                  break
              except Exception as e:
                  print(f'Waiting for PostgreSQL service: {e}')
                  time.sleep(2)
          "

      - name: Run Pytest
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-32-chars-minimum!
          DJANGO_DEBUG: "False"
          DB_NAME: nrpj740_test
          DB_USER: postgres
          DB_PASSWORD: postgres_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          pytest backend/tests/ -v

  clean-stack:
    name: Clean Stack, Headers and Browser Journeys (NT-07, NT-09, TC-19, TC-42)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the documented stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 180 db api proxy

      - name: Check security headers
        run: sh deploy/check-headers.sh http://localhost:8080

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Playwright journeys
        working-directory: frontend
        env:
          E2E_DEMO_PASSWORD: change-me-demo-password
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 80
